# Platform template for PS-SEC-02: scan the full git history for secrets on every PR and push to main.
# Copy unchanged. Run commands use plain env vars ($RUNNER_TEMP, $GITHUB_PATH), not ${{ }} expressions, so the
# Engine's Linux replay can run every step. Uses only a GitHub-owned action (allowed by every IntelIP repo policy)
# and a pinned, checksum-verified gitleaks binary.
name: Secret scan
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Exact commit to check
        type: string
        required: true
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.24.3"
      GITLEAKS_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned gitleaks (checksum verified)
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 --output gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan the full git history
        run: gitleaks git --redact --no-banner --log-opts="--all" .
